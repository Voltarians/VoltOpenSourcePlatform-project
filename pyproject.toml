[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volt-open-source-platform"
version = "0.6.0"
description = "Open CAN and diagnostic research tooling for the Chevrolet Volt and Cadillac ELR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21"]
license = { text = "MIT" }
authors = [{ name = "Voltarians" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
voltec = "tools.voltec_cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]
