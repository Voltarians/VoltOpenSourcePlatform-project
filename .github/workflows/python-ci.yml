name: Python validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m compileall -q tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate public DBC
        run: |
          python tools/parsers/csv_to_dbc.py             docs/can/racelogic/volt_public_signals.csv             /tmp/volt_public.dbc
          cmp docs/can/racelogic/volt_public.dbc /tmp/volt_public.dbc
