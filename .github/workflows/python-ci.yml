name: Python validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolkit
        run: python -m pip install -e .

      - name: Compile sources
        run: python -m compileall -q tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise CLI
        run: |
          voltec --version
          voltec list-signals --can-id 0xC9
          voltec validate-dbc
          voltec inspect-log tests/fixtures/sample_candump.log
          voltec unknown-ids tests/fixtures/sample_candump.log
          voltec research-log tests/fixtures/sample_candump.log --output /tmp/research.md
          voltec research-log tests/fixtures/sample_candump.log --json --output /tmp/research.json
          voltec normalize-log tests/fixtures/sample_candump.log /tmp/normalized.csv
          voltec compare-logs tests/fixtures/sample_candump.log tests/fixtures/sample_candump.log
          voltec atlas validate
          voltec atlas vehicles
          voltec atlas modules
          voltec atlas signals --can-id 0x4D1
          voltec atlas lookup HPCM2
          voltec atlas export-json /tmp/atlas.json
          voltec atlas export-csv /tmp/atlas.csv
          voltec atlas export-dbc /tmp/atlas.dbc
